<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MedReyting</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f4f5f7}
#loading-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;background:linear-gradient(135deg,#e8f0fb 0%,#f0faf5 100%);gap:16px}
.spinner{width:48px;height:48px;border:4px solid #E6F1FB;border-top-color:#185FA5;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#185FA5;font-weight:600;font-size:14px}
#auth-screen{display:none;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;background:linear-gradient(135deg,#e8f0fb 0%,#f0faf5 100%)}
.auth-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:36px 40px;width:360px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.auth-icon{width:42px;height:42px;background:#E6F1FB;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#185FA5;font-size:22px}
.auth-title{font-size:19px;font-weight:700}
.auth-sub{font-size:12px;color:#6b7280;margin-top:2px}
.auth-tabs{display:flex;margin-bottom:20px;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden}
.auth-tab{flex:1;padding:8px;text-align:center;font-size:13px;cursor:pointer;color:#6b7280;font-weight:500}
.auth-tab.active{background:#185FA5;color:#fff}
.lfield{margin-bottom:13px}
.lfield label{display:block;font-size:12px;color:#6b7280;margin-bottom:4px;font-weight:500}
.lfield input,.lfield select{width:100%;padding:9px 12px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;font-size:13px;font-family:inherit;outline:none}
.lfield input:focus,.lfield select:focus{border-color:#185FA5}
.lbtn{width:100%;padding:11px;background:#185FA5;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;font-family:inherit}
.lbtn:hover{background:#0C447C}
.lerr{color:#E24B4A;font-size:12px;margin-top:8px;text-align:center}
.lsuc{color:#1D9E75;font-size:12px;margin-top:8px;text-align:center}
#app{display:none}
.sync-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:#1D9E75;background:#E1F5EE;padding:3px 8px;border-radius:10px;font-weight:600}
.sync-dot{width:6px;height:6px;background:#1D9E75;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:10}
.topbar-brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:34px;height:34px;background:#E6F1FB;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#185FA5;font-size:18px}
.brand-name{font-size:16px;font-weight:700;color:#185FA5}
.brand-loc{font-size:11px;color:#6b7280}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:7px;background:#f4f5f7;border-radius:20px;padding:5px 12px 5px 5px}
.user-avatar{width:28px;height:28px;background:#185FA5;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600}
.user-name{font-size:12px;font-weight:500}
.role-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.role-admin{background:#E6F1FB;color:#185FA5}.role-doctor{background:#E1F5EE;color:#0F6E56}
.logout-btn{background:none;border:1px solid #e5e7eb;border-radius:7px;padding:5px 12px;cursor:pointer;color:#6b7280;font-size:12px;font-family:inherit}
.main-nav{display:flex;background:#fff;border-bottom:1px solid #e5e7eb;padding:0 20px;overflow-x:auto;gap:2px;position:sticky;top:54px;z-index:9}
.main-tab{padding:13px 16px;cursor:pointer;font-size:13px;color:#6b7280;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;font-weight:500}
.main-tab:hover{color:#1a1a1a}.main-tab.active{color:#185FA5;font-weight:600;border-bottom-color:#185FA5}
.content{overflow-y:auto}.page{display:none}.page.active{display:block}

/* SIDEBAR REDESIGN */
.split-layout{display:flex;min-height:calc(100vh - 108px)}
.sidebar{width:280px;flex-shrink:0;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;overflow-y:auto}
.sb-block{padding:14px;border-bottom:1px solid #f3f4f6}
.sb-block-title{font-size:10px;font-weight:700;color:#9ca3af;letter-spacing:.6px;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sb-add-btn{font-size:11px;color:#185FA5;cursor:pointer;font-weight:600;padding:3px 8px;border-radius:5px;background:#EEF5FC}
.sb-add-btn:hover{background:#185FA5;color:#fff}
.sb-select{width:100%;padding:8px 10px;border:1px solid #e5e7eb;border-radius:7px;font-size:13px;background:#fff;font-family:inherit;cursor:pointer;outline:none}
.sb-select:focus{border-color:#185FA5}
.sb-row-actions{display:flex;gap:6px;margin-top:8px}
.sb-mini-btn{flex:1;padding:6px;border:1px solid #e5e7eb;border-radius:6px;font-size:11px;background:#fff;cursor:pointer;font-family:inherit;font-weight:500;display:flex;align-items:center;justify-content:center;gap:4px}
.sb-mini-btn:hover{background:#f4f5f7}
.sb-mini-btn.red:hover{background:#FCEBEB;color:#E24B4A;border-color:#FCEBEB}
.sb-data-btn{width:100%;padding:9px;background:#185FA5;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px}
.sb-data-btn:hover{background:#0C447C}
.sb-ind-list{flex:1;overflow-y:auto;padding:6px 0}
.sb-ind-item{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;font-size:13px;color:#6b7280;border-left:3px solid transparent;gap:6px;transition:all .1s}
.sb-ind-item:hover{background:#f9fafb;color:#1a1a1a}
.sb-ind-item.active{background:#EEF5FC;color:#185FA5;font-weight:600;border-left-color:#185FA5}
.sb-ind-actions{display:flex;gap:2px;opacity:0}
.sb-ind-item:hover .sb-ind-actions{opacity:1}
.sb-ind-actions span{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:12px;color:#9ca3af;cursor:pointer}
.sb-ind-actions span:hover{background:#FCEBEB;color:#E24B4A}
.sb-ind-actions span.edit:hover{background:#EEF5FC;color:#185FA5}

.main-panel{flex:1;padding:20px;min-width:0;background:#f4f5f7}
.main-pg{padding:20px;background:#f4f5f7;min-height:calc(100vh - 108px)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px 16px;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.kpi-accent{position:absolute;top:0;left:0;width:4px;height:100%}
.kpi-label{font-size:10px;color:#9ca3af;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.kpi-value{font-size:28px;font-weight:700;line-height:1}
.kpi-sub{font-size:11px;color:#9ca3af;margin-top:5px}
.g{color:#1D9E75}.a{color:#BA7517}.r{color:#E24B4A}
.charts-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.chart-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.chart-card-title{font-size:10px;font-weight:600;color:#9ca3af;margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
.pb-wrap{margin-bottom:9px}.pb-hdr{display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-bottom:4px}
.pb-track{background:#f3f4f6;border-radius:6px;height:20px;overflow:hidden}
.pb-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;color:#fff;font-weight:600;transition:width .4s}
.ind-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.ikpi{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ikpi-label{font-size:11px;color:#9ca3af;margin-bottom:4px}.ikpi-val{font-size:20px;font-weight:700}
.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.entity-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ec-name{font-size:12px;font-weight:600;margin-bottom:5px}.ec-score{font-size:22px;font-weight:700}.ec-sub{font-size:11px;color:#9ca3af;margin-top:2px}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600}
.bg-g{background:#E1F5EE;color:#0F6E56}.bg-a{background:#FAEEDA;color:#854F0B}.bg-r{background:#FCEBEB;color:#A32D2D}
.doc-banner{background:linear-gradient(135deg,#185FA5 0%,#1D9E75 100%);border-radius:12px;padding:22px 24px;color:#fff;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.doc-banner-title{font-size:17px;font-weight:700}.doc-banner-sub{font-size:12px;opacity:.85;margin-top:4px}
.doc-banner-badge{background:rgba(255,255,255,.2);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600}
.users-table-wrap{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}thead tr{background:#f9fafb}
th{padding:11px 14px;text-align:left;font-weight:600;font-size:11px;color:#9ca3af;border-bottom:1px solid #e5e7eb;text-transform:uppercase}
td{padding:11px 14px;border-bottom:1px solid #f3f4f6}tr:last-child td{border-bottom:none}
.del-row-btn{background:none;border:none;cursor:pointer;color:#9ca3af;font-size:12px;padding:3px 8px;border-radius:5px;font-family:inherit;font-weight:500}
.del-row-btn:hover{background:#FCEBEB;color:#E24B4A}
.rank-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f3f4f6}.rank-row:last-child{border-bottom:none}
.rank-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.rn1{background:#FFF3CD;color:#856404}.rn2{background:#F0F0F0;color:#555}.rn3{background:#FBE8DC;color:#8B3A1A}.rnn{background:#f3f4f6;color:#9ca3af}
.rank-name{flex:1;font-size:13px;font-weight:600}.rank-bar{flex:2;background:#f3f4f6;border-radius:4px;height:12px;overflow:hidden}.rank-bar-fill{height:100%;border-radius:4px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:26px;width:480px;max-width:96vw;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-title{font-size:15px;font-weight:700;margin-bottom:18px}
.mfield{margin-bottom:12px}.mfield label{display:block;font-size:12px;color:#6b7280;margin-bottom:4px;font-weight:500}
.mfield input,.mfield select{width:100%;padding:8px 11px;border:1px solid #e5e7eb;border-radius:7px;background:#fff;font-size:13px;font-family:inherit;outline:none}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.mbtn{padding:8px 18px;border:1px solid #e5e7eb;border-radius:7px;font-size:13px;background:#fff;cursor:pointer;font-family:inherit;font-weight:500}
.mbtn:hover{background:#f4f5f7}.mbtn.p{background:#185FA5;color:#fff;border-color:#185FA5;font-weight:600}.mbtn.p:hover{background:#0C447C}
.dg{display:grid;grid-template-columns:1fr 72px 72px;gap:6px;align-items:center;margin-bottom:7px}
.dg input{padding:6px 8px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;font-family:inherit;width:100%;outline:none}
.dg1{display:grid;grid-template-columns:1fr 100px;gap:6px;align-items:center;margin-bottom:7px}
.ent-sep{font-size:12px;font-weight:600;color:#6b7280;padding:10px 0 6px;border-top:1px solid #f3f4f6;margin-top:10px}
.sel-sm{padding:6px 10px;border:1px solid #e5e7eb;border-radius:7px;font-size:12px;background:#fff;font-family:inherit}
.fbadge{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:600;margin-left:6px}
.fbadge-up{background:#E1F5EE;color:#0F6E56}.fbadge-down{background:#FCEBEB;color:#A32D2D}.fbadge-abs{background:#EEF5FC;color:#185FA5}
.thr-info{font-size:11px;color:#9ca3af}
.thr-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.thr-cell label{font-size:10px;color:#9ca3af;display:block;margin-bottom:2px}
.thr-cell input{width:100%;padding:5px 6px;border:1px solid #e5e7eb;border-radius:5px;font-size:11px;font-family:inherit;outline:none}
.abs-thresh-box{margin-top:12px;padding:12px;background:#f9fafb;border-radius:8px}
.abs-thresh-row{display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:center;margin-bottom:8px}
.abs-thresh-row label{font-size:11px;color:#6b7280}
.abs-thresh-row input{padding:6px 8px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;font-family:inherit;outline:none}
</style>
</head>
<body>
<div id="loading-screen"><div class="spinner"></div><div class="loading-text">Подключение...</div></div>
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo"><div class="auth-icon"><i class="ti ti-activity-heartbeat"></i></div><div><div class="auth-title">MedReyting</div><div class="auth-sub">Туркестанская область, Шымкент</div></div></div>
    <div class="auth-tabs"><div class="auth-tab active" id="tab-login" onclick="switchAuth('login')">Войти</div><div class="auth-tab" id="tab-reg" onclick="switchAuth('reg')">Регистрация</div></div>
    <div id="auth-login">
      <div class="lfield"><label>Логин</label><input id="l-u" type="text"/></div>
      <div class="lfield"><label>Пароль</label><input id="l-p" type="password" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <button class="lbtn" onclick="doLogin()">Войти</button><div class="lerr" id="l-err"></div>
    </div>
    <div id="auth-reg" style="display:none">
      <div class="lfield"><label>ФИО</label><input id="r-name" type="text"/></div>
      <div class="lfield"><label>Логин</label><input id="r-login" type="text"/></div>
      <div class="lfield"><label>Пароль</label><input id="r-pass" type="password"/></div>
      <div class="lfield"><label>Раздел</label><select id="r-sec" onchange="populateRegEntity()"><option value="uch">Участковая служба</option><option value="sp">Узкие специалисты</option><option value="st">Стационар 24/7</option></select></div>
      <div class="lfield"><label>Объект</label><select id="r-entity"></select></div>
      <button class="lbtn" onclick="doRegister()">Зарегистрироваться</button><div class="lerr" id="r-err"></div><div class="lsuc" id="r-suc"></div>
    </div>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <div class="topbar-brand"><div class="brand-icon"><i class="ti ti-activity-heartbeat"></i></div><div><div style="display:flex;align-items:center;gap:8px"><div class="brand-name">MedReyting</div><span class="sync-badge"><span class="sync-dot"></span>Облако</span></div><div class="brand-loc">Туркестанская область</div></div></div>
    <div class="topbar-right"><div class="user-chip"><div class="user-avatar" id="u-av">А</div><div class="user-name" id="u-nm">Аскар</div><span class="role-badge role-admin" id="u-role">Админ</span></div><button class="logout-btn" onclick="doLogout()">Выйти</button></div>
  </div>
  <div class="main-nav" id="main-nav"></div>
  <div class="content">
    <div class="page active" id="pg-0"><div class="main-pg"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px"><div style="font-size:15px;font-weight:700">Общая сводка</div><select class="sel-sm" id="main-m" onchange="onMainMChange()"><option value="0">Январь</option><option value="1">Февраль</option><option value="2">Март</option><option value="3">Апрель</option><option value="4">Май</option><option value="5">Июнь</option><option value="6">Июль</option><option value="7">Август</option><option value="8">Сентябрь</option><option value="9">Октябрь</option><option value="10">Ноябрь</option><option value="11">Декабрь</option></select></div><div id="main-body"></div></div></div>
    <div class="page" id="pg-1"><div class="split-layout"><div class="sidebar" id="sb-uch"></div><div class="main-panel" id="mp-uch"></div></div></div>
    <div class="page" id="pg-2"><div class="split-layout"><div class="sidebar" id="sb-sp"></div><div class="main-panel" id="mp-sp"></div></div></div>
    <div class="page" id="pg-3"><div class="split-layout"><div class="sidebar" id="sb-st"></div><div class="main-panel" id="mp-st"></div></div></div>
    <div class="page" id="pg-4"><div class="main-pg"><div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap"><select class="sel-sm" id="r-type" onchange="buildRankPeriods();renderRank()"><option value="month">По месяцу</option><option value="quarter">По кварталу</option><option value="year">По году</option></select><select class="sel-sm" id="r-period" onchange="renderRank()"></select><select class="sel-sm" id="r-sec-sel" onchange="renderRank()"><option value="uch">Участковая служба</option><option value="sp">Узкие специалисты</option><option value="st">Стационар</option></select></div><div id="r-content"></div></div></div>
    <div class="page" id="pg-5"><div class="main-pg"><div style="font-size:15px;font-weight:700;margin-bottom:18px">Пользователи</div><div id="users-content"></div></div></div>
  </div>
</div>
<div class="modal-overlay" id="m-ov"><div class="modal"><div class="modal-title" id="m-t"></div><div id="m-b"></div><div class="modal-btns"><button class="mbtn" onclick="closeModal()">Отмена</button><button class="mbtn p" onclick="modalSave()">Сохранить</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const fb=initializeApp({apiKey:"AIzaSyC6iMiMp2Hm-z5J3N3EGTkuwV2l_zArz1A",authDomain:"medreyting.firebaseapp.com",projectId:"medreyting",storageBucket:"medreyting.firebasestorage.app",messagingSenderId:"801594471732",appId:"1:801594471732:web:9b24253f13aeaa41222161"});
const db=getFirestore(fb);window.fbDB=db;window.fbDoc=doc;window.fbGetDoc=getDoc;window.fbSetDoc=setDoc;window.fbOnSnap=onSnapshot;window.dispatchEvent(new Event('fb-ready'));
</script>
<script>
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const S={
  uchDistricts:['Участок №1','Участок №2','Участок №3'],
  uchInds:[{id:'u1',name:'Охват профосмотрами',max:10,formula:'more',thresholds:Array(12).fill(0)},{id:'u2',name:'Диспансеризация',max:10,formula:'more',thresholds:Array(12).fill(0)},{id:'u3',name:'Вакцинация',max:10,formula:'more',thresholds:Array(12).fill(0)}],
  uchData:{},
  spDoctors:['Кардиолог','Эндокринолог','Невролог'],
  spInds:[{id:'s1',name:'Охват пациентов',max:10,formula:'more',thresholds:Array(12).fill(0)},{id:'s2',name:'Летальность',max:10,formula:'less',thresholds:Array(12).fill(0)}],
  spData:{},
  stDepts:['Терапия','Хирургия','Реанимация'],
  stInds:[{id:'t1',name:'Занятость коек',max:10,formula:'more',thresholds:Array(12).fill(0)},{id:'t2',name:'Летальность',max:10,formula:'less',thresholds:Array(12).fill(0)}],

// === ПРАВИЛЬНЫЙ РАСЧЁТ ===
// % выполнения
function calcPct(ind,plan,fact){
  if(ind.formula==='abs')return 0; // для abs процент не применим
  if(ind.formula==='less'){
    if(fact===0)return 100;
    if(!plan||plan===0)return 0;
    return Math.round((plan/fact)*100);
  }
  // more
  if(!plan||plan===0)return 0;
  return Math.round((fact/plan)*100);
}

// Балл = max * (pct / 100). Например: max=10, pct=91% → 9.1
function calcScore(ind,plan,fact,month){
  if(ind.formula==='abs'){
    const v=fact,g=ind.absGreen||0,y=ind.absYellow||0,mode=ind.absMode||'less';
    if(mode==='less'){
      if(v<=g)return ind.max;
      if(v<=y)return +(ind.max*0.6).toFixed(2);
      return +(ind.max*0.3).toFixed(2);
    }
    if(v>=g)return ind.max;
    if(v>=y)return +(ind.max*0.6).toFixed(2);
    return +(ind.max*0.3).toFixed(2);
  }
  const p=calcPct(ind,plan,fact);
  const thr=ind.thresholds?ind.thresholds[month]||0:0;
  // Если есть порог и факт ниже порога — балл = 0
  if(thr>0&&p<thr)return 0;
  // Пропорционально: 100%=max, 91%=max*0.91, 50%=max*0.5
  const capped=Math.min(p,100);
  return +(ind.max*capped/100).toFixed(2);
}

function getDisplayPct(ind,plan,fact){
  if(ind.formula==='abs'){
    const v=fact,g=ind.absGreen||0,y=ind.absYellow||0,mode=ind.absMode||'less';
    if(mode==='less'){if(v<=g)return 100;if(v<=y)return 70;return 30;}
    if(v>=g)return 100;if(v>=y)return 70;return 30;
  }
  return calcPct(ind,plan,fact);
}

function clr(p){return p>=90?'#1D9E75':p>=70?'#BA7517':'#E24B4A';}
function bdg(p){return p>=90?'bg-g':p>=70?'bg-a':'bg-r';}
function stt(p){return p>=90?'Выполнено':p>=70?'Частично':'Не выполнено';}
function cls(p){return p>=90?'g':p>=70?'a':'r';}

function totEnt(s,e,m){let ts=0,tm=0;getInds(s).forEach(i=>{const v=getV(s,e,m,i.id);ts+=calcScore(i,v.plan,v.fact,m);tm+=i.max;});return{score:+ts.toFixed(2),max:tm,pct:tm?Math.round(ts/tm*100):0};}
function secAvg(s,m){const es=getEnts(s);if(!es.length)return 0;return Math.round(es.reduce((a,e)=>a+totEnt(s,e,m).pct,0)/es.length);}

function openEditInd(s,id){const a=getInds(s),ind=a.find(x=>x.id===id);if(!ind)return;mMode='edit-ind';mCtx={sec:s,id};document.getElementById('m-ov').classList.add('open');document.getElementById('m-t').textContent='Редактировать показатель';buildIndModal(ind);}

function buildIndModal(ind){
  const isAbs=ind?ind.formula==='abs':false;
  let th='<div id="thr-section" style="margin-top:12px;'+(isAbs?'display:none':'')+'"><div style="font-size:12px;color:#6b7280;font-weight:500;margin-bottom:6px">Порог % по месяцам</div><div class="thr-grid">';
  MN.forEach((mn,i)=>th+=`<div class="thr-cell"><label>${mn.substring(0,3)}</label><input type="number" id="thr-${i}" value="${ind&&ind.thresholds?ind.thresholds[i]:0}" min="0" max="100"/></div>`);
  th+='</div></div>';
  const absBox=`<div id="abs-section" style="margin-top:12px;${isAbs?'':'display:none'}"><div class="abs-thresh-box"><div style="font-size:12px;color:#6b7280;font-weight:500;margin-bottom:8px">Зоны для абсолютного значения</div>
    <div class="mfield" style="margin-bottom:8px"><label>Логика</label><select id="abs-mode"><option value="less"${ind&&ind.absMode==='less'?' selected':''}>Меньше = лучше</option><option value="more"${ind&&ind.absMode==='more'?' selected':''}>Больше = лучше</option></select></div>
    <div class="abs-thresh-row"><label>🟢 Зелёная зона</label><input type="number" id="abs-green" value="${ind&&ind.absGreen!=null?ind.absGreen:0}" step="0.01"/></div>
    <div class="abs-thresh-row"><label>🟡 Жёлтая зона</label><input type="number" id="abs-yellow" value="${ind&&ind.absYellow!=null?ind.absYellow:0}" step="0.01"/></div>
    <div style="font-size:10px;color:#9ca3af;margin-top:8px">"Меньше=лучше": ≤зелёного=макс баллы, ≤жёлтого=60%, выше=30%</div>
  </div></div>`;
  document.getElementById('m-b').innerHTML=`
    <div class="mfield"><label>Название</label><input id="mv1" value="${ind?ind.name:''}"/></div>
    <div class="mfield"><label>Макс. балл</label><input id="mv2" type="number" value="${ind?ind.max:10}" min="1" max="20"/></div>
    <div class="mfield"><label>Формула</label><select id="mv3" onchange="toggleAbsBox()">
      <option value="more"${ind&&ind.formula==='more'?' selected':''}>↑ Больше = лучше</option>
      <option value="less"${ind&&ind.formula==='less'?' selected':''}>↓ Меньше = лучше</option>
      <option value="abs"${ind&&ind.formula==='abs'?' selected':''}>≡ Абсолютное значение</option>
    </select></div>
    ${absBox}${th}`;
}
function toggleAbsBox(){const f=document.getElementById('mv3').value;document.getElementById('abs-section').style.display=f==='abs'?'block':'none';document.getElementById('thr-section').style.display=f==='abs'?'none':'block';}

function renderUsers(){const docs=USERS.filter(u=>u.role==='doctor');let h=`<div class="users-table-wrap"><table><thead><tr><th>ФИО</th><th>Логин</th><th>Раздел</th><th>Объект</th><th></th></tr></thead><tbody>`;if(!docs.length)h+=`<tr><td colspan="5" style="color:#9ca3af;padding:20px">Нет врачей</td></tr>`;docs.forEach(u=>{h+=`<tr><td><b>${u.name}</b></td><td>${u.login}</td><td>${u.sec==='uch'?'Участковая':u.sec==='sp'?'Узкие':'Стационар'}</td><td>${u.entity}</td><td><button class="del-row-btn" onclick="deleteUser('${u.login}')">×</button></td></tr>`;});h+=`</tbody></table></div>`;document.getElementById('users-content').innerHTML=h;}
function deleteUser(l){if(!confirm('Удалить?'))return;USERS=USERS.filter(u=>u.login!==l);saveCloud();renderUsers();}

function buildRankPeriods(){const t=document.getElementById('r-type').value,s=document.getElementById('r-period');s.innerHTML='';if(t==='month'){MN.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=m;s.appendChild(o);});s.value=new Date().getMonth();}else if(t==='quarter'){['I кв','II кв','III кв','IV кв'].forEach((q,i)=>{const o=document.createElement('option');o.value=i;o.textContent=q;s.appendChild(o);});}else{[2025,2026].forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;s.appendChild(o);});}}
function renderRank(){const t=document.getElementById('r-type').value,p=document.getElementById('r-period').value,s=document.getElementById('r-sec-sel').value,ents=[...getEnts(s)];let ms=t==='month'?[parseInt(p)]:t==='quarter'?[0,1,2].map(i=>parseInt(p)*3+i):[...Array(12).keys()];const rows=ents.map(e=>{let ts=0,tm=0;ms.forEach(mo=>{const r=totEnt(s,e,mo);ts+=r.score;tm+=r.max;});return{e,s:+ts.toFixed(2),m:tm,p:tm?Math.round(ts/tm*100):0};}).sort((a,b)=>b.s-a.s);const mx=rows[0]?.s||1,nc=['rn1','rn2','rn3'];let h=`<div class="chart-card">`;rows.forEach((r,i)=>h+=`<div class="rank-row"><div class="rank-num ${i<3?nc[i]:'rnn'}">${i+1}</div><div class="rank-name">${r.e}</div><div class="rank-bar"><div class="rank-bar-fill" style="width:${Math.round(r.s/mx*100)}%;background:${clr(r.p)}"></div></div><div style="width:60px;text-align:right;font-size:13px;font-weight:600">${r.s}б</div><div style="width:54px;text-align:right"><span class="badge ${bdg(r.p)}">${r.p}%</span></div></div>`);h+=`</div>`;if(!rows.length)h='<div style="padding:20px;color:#9ca3af">Нет данных</div>';document.getElementById('r-content').innerHTML=h;}

function openM(mode,sec){mMode=mode;mCtx={sec};document.getElementById('m-ov').classList.add('open');const t=document.getElementById('m-t');
if(mode==='add-ind'){t.textContent='Новый показатель';buildIndModal(null);}
else if(mode==='add-entity'){t.textContent=sec==='uch'?'Новый участок':sec==='sp'?'Новый специалист':'Новое отделение';document.getElementById('m-b').innerHTML=`<div class="mfield"><label>Название</label><input id="mv1"/></div>`;}
else if(mode==='enter-data'){const m=curMonth[sec],inds=getInds(sec),ents=getEnts(sec);mCtx={sec,m};t.textContent='Данные — '+MN[m];let h='<div style="max-height:400px;overflow-y:auto">';ents.forEach(ent=>{h+=`<div class="ent-sep">${ent}</div>`;inds.forEach(ind=>{const v=getV(sec,ent,m,ind.id),ek=ent.replace(/[\s№]/g,'_'),fi=ind.formula==='more'?'↑':ind.formula==='less'?'↓':'≡';if(ind.formula==='abs'){h+=`<div class="dg1"><div style="font-size:12px;color:#6b7280">${fi} ${ind.name}</div><input type="number" id="f_${ek}_${ind.id}" value="${v.fact||''}"/></div>`;}else{h+=`<div class="dg"><div style="font-size:12px;color:#6b7280">${fi} ${ind.name}</div><input type="number" id="p_${ek}_${ind.id}" placeholder="План" value="${v.plan||''}"/><input type="number" id="f_${ek}_${ind.id}" placeholder="Факт" value="${v.fact||''}"/></div>`;}});});h+='</div>';document.getElementById('m-b').innerHTML=h;}}
function closeModal(){document.getElementById('m-ov').classList.remove('open');}
function modalSave(){const{sec,m,id,idx,oldName}=mCtx;
if(mMode==='add-ind'||mMode==='edit-ind'){
  const n=document.getElementById('mv1').value.trim(),mx=parseInt(document.getElementById('mv2').value)||10,f=document.getElementById('mv3').value;
  if(!n){closeModal();return;}
  const obj={name:n,max:mx,formula:f};
  if(f==='abs'){obj.absMode=document.getElementById('abs-mode').value;obj.absGreen=parseFloat(document.getElementById('abs-green').value)||0;obj.absYellow=parseFloat(document.getElementById('abs-yellow').value)||0;obj.thresholds=Array(12).fill(0);}
  else{obj.thresholds=MN.map((_,i)=>parseInt(document.getElementById('thr-'+i)?.value)||0);}
  if(mMode==='edit-ind'){const ind=getInds(sec||mCtx.sec).find(i=>i.id===(id||mCtx.id));if(ind)Object.assign(ind,obj);saveCloud();renderSec(sec||mCtx.sec);}
  else{obj.id=sec[0]+Date.now();getInds(sec).push(obj);saveCloud();renderSec(sec);}
}
else if(mMode==='add-entity'){const n=document.getElementById('mv1').value.trim();if(n){if(sec==='uch'&&!S.uchDistricts.includes(n)){S.uchDistricts.push(n);curEnt[sec]=n;}else if(sec==='sp'&&!S.spDoctors.includes(n)){S.spDoctors.push(n);curEnt[sec]=n;}else if(sec==='st'&&!S.stDepts.includes(n)){S.stDepts.push(n);curEnt[sec]=n;}saveCloud();}renderSec(sec);}
else if(mMode==='edit-entity'){const newName=document.getElementById('mv1').value.trim();if(newName&&newName!==oldName){const arr=getEnts(sec);arr[idx]=newName;const dat=getDat(sec);Object.keys(dat).forEach(k=>{if(k.startsWith(oldName+'|')){const nk=newName+k.substring(oldName.length);dat[nk]=dat[k];delete dat[k];}});USERS.forEach(u=>{if(u.entity===oldName&&u.sec===sec)u.entity=newName;});if(curEnt[sec]===oldName)curEnt[sec]=newName;saveCloud();}renderSec(sec);}
else if(mMode==='enter-data'){getEnts(sec).forEach(ent=>{getInds(sec).forEach(ind=>{const ek=ent.replace(/[\s№]/g,'_'),fEl=document.getElementById('f_'+ek+'_'+ind.id),pEl=document.getElementById('p_'+ek+'_'+ind.id);if(ind.formula==='abs'){if(fEl)setV(sec,ent,m,ind.id,0,fEl.value);}else{if(pEl&&fEl)setV(sec,ent,m,ind.id,pEl.value,fEl.value);}});});renderSec(sec);if(CU.role==='admin')renderMain();}
closeModal();}
</script>
</body>
